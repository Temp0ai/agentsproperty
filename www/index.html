<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SuperSplat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #111; color: #fff;
      z-index: 9999; transition: opacity 0.4s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #4a9eff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    #splash p { font-size: 0.8rem; color: #666; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="spinner"></div>
    <h1>SuperSplat</h1>
    <p>Loading editor...</p>
  </div>
  <iframe id="editor" src="https://superspl.at/editor"></iframe>
  <script>
    document.getElementById('editor').addEventListener('load', function() {
      setTimeout(function() { document.getElementById('splash').classList.add('hidden'); }, 300);
    });
    setTimeout(function() { document.getElementById('splash').classList.add('hidden'); }, 8000);
  </script>
</body>
</html>
